name: apply-patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python patch_vector.py || true
          python patch_script_gen2.py
          rm -f vector.py.bak script_gen2.py.bak patch_vector.py patch_script_gen2.py
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "apply visual patches"
          git push
