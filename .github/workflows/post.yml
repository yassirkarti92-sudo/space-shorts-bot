name: space-shorts
on:
  schedule:
    - cron: "0 7,12,17 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: voices
          key: piper-voice-ryan-medium
      - run: python3 -m piper.download_voices en_US-ryan-medium --download-dir voices
      - run: python main.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BUFFER_KEY: ${{ secrets.BUFFER_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      - run: |
          git config user.name "space-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || (git commit -m "update history" && git push)
