name: List models

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "google-genai>=2.25.0"
      - name: Probe TTS models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > probe.py << 'EOF'
          from google import genai
          from google.genai import types
          c = genai.Client()
          for name in ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts", "gemini-2.5-pro-preview-tts"]:
              try:
                  r = c.models.generate_content(
                      model=name,
                      contents="Say flatly: testing one two three.",
                      config=types.GenerateContentConfig(
                          response_modalities=["AUDIO"],
                          speech_config=types.SpeechConfig(
                              voice_config=types.VoiceConfig(
                                  prebuilt_voice_config=types.PrebuiltVoiceConfig(voice_name="Kore")))),
                  )
                  n = len(r.candidates[0].content.parts[0].inline_data.data)
                  print("OK", name, n, "bytes")
              except Exception as e:
                  print("FAIL", name, str(e)[:160])
          EOF
          python probe.py
